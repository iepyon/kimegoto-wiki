# ============================================================
# ontology.yaml — 型・フィールド・語彙・関係・導出の唯一の正本
#
# ここに置くのは「機械が実際に評価するもの」だけ。
# なぜそのフィールドが要るのかという論述は schema.md にある。
# schema.md の生成ブロック（型一覧・フィールド表など）は、このファイルから生成される。
# サンプル frontmatter は生成せず、宣言との食い違いを照合する（kime schema --check-samples）。
#
# 数値の閾値をコードに書かない。すべて thresholds に置く。
# ============================================================

version: 1

# ------------------------------------------------------------
# 8種のカード
#   layer  : flow  = 会議ごとに生成 / stock = 昇格承認を経て育つ
#   dir    : 置き場ディレクトリ（LOG のみ meetings/MTG-*/logs/ 配下）
#   label  : 生成物やメッセージで使う日本語名
#   summary: その型が何を表すかの1行（schema.md の型一覧に生成される）
#   closed-status: 閉じた status。これ以外は開いている（アジェンダに持ち越す・lint が追う）
#   active-status: 現に効いている status（DEC はみなし確定の対象、ASM は棚卸しの対象）
#   extract-kinds: （LOG のみ）Pass 3 が最低1件を出す論点の種別（欠落ガード）
#   tracked-vulnerability: （ASM のみ）棚卸しで追う `脆弱性`。それ以外は記録するが追わない
#   headline: そのカードの見出しになるフィールド（DEC/Q/ACT は title、
#             CON/ASM は 内容、TERM は 正式。ここが型ごとに違う）
# ------------------------------------------------------------

types:

  LOG:
    label: 会話ログ
    summary: 論点単位に切り出した逐語の束。すべての引用の照合先。会議ごとに新規
    layer: flow
    dir: logs
    nested-under: meetings
    id: "^LOG-\\d{8}-\\d{2}$"
    type-value: log
    headline: title
    has-quote: false
    extract-kinds: [議論, 確認]

  # 議題。会議をまたいで続く「決めたいこと」の単位で、DEC / Q / ACT の親。
  # 子が `議題` で親を指し、親は子の一覧を持たない（逆引きで得る。二重管理しない）。
  # 文字起こしより先に（会議の前や冒頭に）起票されるので、引用を持たない。
  AGD:
    label: 議題
    summary: 会議をまたいで続く「決めたいこと」。DEC / Q / ACT の親。決着で閉じる
    layer: flow
    dir: agenda
    id: "^AGD-\\d{3}$"
    type-value: agenda
    headline: title
    has-quote: false
    closed-status: [決着, 取り下げ]

  DEC:
    label: 決定事項
    summary: 会議で決まったこと。会議をまたいで更新される
    layer: flow
    dir: decisions
    id: "^DEC-\\d{3}$"
    type-value: decision
    headline: title
    has-quote: true
    closed-status: [覆された]
    active-status: [決定]

  Q:
    label: 未定事項
    summary: 決めるために足りないもの。解決で閉じる
    layer: flow
    dir: questions
    id: "^Q-\\d{3}$"
    type-value: question
    headline: title
    has-quote: true
    closed-status: [解決, 取り下げ]

  ACT:
    label: アクション
    summary: 会社間で約束したこと。完了で閉じる
    layer: flow
    dir: actions
    id: "^ACT-\\d{3}$"
    type-value: action
    headline: title
    has-quote: true
    closed-status: [完了, 取り下げ]

  CON:
    label: 制約
    summary: 選択肢を削る環境の性質。昇格承認を経て1枚が育つ
    layer: stock
    dir: constraints
    id: "^CON-\\d{3}$"
    type-value: constraint
    headline: 内容
    has-quote: true

  ASM:
    label: 前提
    summary: 成り立っていればよい仮定。崩れたら決定を見直す
    layer: stock
    dir: assumptions
    id: "^ASM-\\d{3}$"
    type-value: assumption
    headline: 内容
    has-quote: true
    active-status: [有効]
    tracked-vulnerability: [高]

  TERM:
    label: 用語
    summary: 案件の用語と表記揺れ。Pass 2 の正規化に還流する
    layer: stock
    dir: terms
    id: "^TERM-\\d{3}$"
    type-value: term
    headline: 正式
    has-quote: false

# 機械が走査に使うものだけ。会議ディレクトリの中で機械が読むのは LOG と、
# Pass 1 の出力（segments.yaml）と Pass 3 の欠落ガードの理由（extraction-notes.yaml）。
# transcript.md / unknown-terms.yaml / promote-candidates.yaml は機械が評価しないので
# ここには置かない。正本は templates/project/README.md と各スキル。
meetings:
  id: "^MTG-\\d{8}$"
  dir: meetings
  logs-dir: logs
  segments-file: segments.yaml
  extraction-notes-file: extraction-notes.yaml

# ------------------------------------------------------------
# 語彙
#   ここに無い値は lint が error にする。
#   空文字を許すかどうかは fields の required で決める（語彙側では許さない）。
# ------------------------------------------------------------

enums:
  LOG種別: [議論, 報告, 確認, 雑談]
  DEC状態: [決定, 保留, 覆された]
  Q状態: [未決, 解決, 取り下げ]
  ACT状態: [未着手, 進行中, 完了, 遅延, 取り下げ]
  AGD状態: [未着手, 継続, 決着, 取り下げ]
  ストック状態: [有効, 失効]
  ASM状態: [有効, 崩れた, 確認中]
  決定種別: [交渉可能, 技術判断, 契約制約]
  スコープ: [当初スコープ内, "スコープ外(追加)", 判定保留]
  信頼度: [逐語あり, 言及のみ, 推測]
  作らない: [該当なし, 記録なし, 未記入]
  制約種類: [property, expectation]
  所在: [自社側, 顧客側, 協力会社, 契約]
  硬度: [溶液, 懸濁, 沈殿, 岩盤]
  脆弱性: [高, 中, 低]
  対策種別: [shaping, hedging]

# ------------------------------------------------------------
# フィールド
#   kind    : id | text | enum | date | ref | ref-list | str-list
#             | struct-list | quote | time-range
#   記入主体 : 自動（LLM が埋める）| 人間（②の確認で埋める）| 導出（機械が決める）
#   ref     : 参照先の型（ref / ref-list のみ）
#   free    : true なら enum の値以外も許す（`作らない` の <内容> のため）
#   description: そのフィールドが何を表すかの1行（schema.md の表に生成される）。
#             なぜ要るかは書かない（論証は schema.md の散文に置く）
# ------------------------------------------------------------

fields:

  LOG:
    id:      { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:    { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    meeting: { kind: ref, ref: MTG, required: true, 記入主体: 自動, description: "この論点を切り出した会議" }
    title:   { kind: text, required: true, 記入主体: 自動, description: "論点の見出し" }
    種別:    { kind: enum, enum: LOG種別, required: true, 記入主体: 自動, description: "論点の性質" }
    時刻:    { kind: time-range, required: false, 記入主体: 自動, description: "文字起こし上の開始・終了時刻" }
    参加役割: { kind: str-list, required: true, 記入主体: 自動, description: "この論点で発言した役割" }

  AGD:
    id:       { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:     { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    title:    { kind: text, required: true, 記入主体: 人間, description: "決めたいこと。提起者の言葉のまま" }
    status:   { kind: enum, enum: AGD状態, required: true, 記入主体: 人間, description: "議題の状態" }
    提起者:   { kind: text, required: true, 記入主体: 人間, description: "議題を出した役割" }
    提起日:   { kind: date, required: true, 記入主体: 導出, description: "議題を出した日" }
    予定会議: { kind: str-list, required: false, 記入主体: 人間, description: "扱う会議。載った会議が足されていく" }
    # 閉じた日（決着・取り下げにした会議の日）。status だけだと「いつ閉じたか」が
    # 記録に残らず、過去の会議の議事録で後の決着が映る（議題の履歴が引けない）。
    決着日:   { kind: date, required: false, 記入主体: 人間, description: "決着・取り下げにした会議の日" }

  DEC:
    id:         { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:       { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    title:      { kind: text, required: true, 記入主体: 自動, description: "決まったことの要約" }
    status:     { kind: enum, enum: DEC状態, required: true, 記入主体: 自動, description: "決定の状態" }
    決定日:     { kind: date, required: true, 記入主体: 自動, description: "決定した会議の日" }
    決定の所在: { kind: text, required: true, 記入主体: 自動, description: "決めた役割。覆せるのは誰かを表す" }
    会議体:     { kind: text, required: true, 記入主体: 導出, description: "決定した契約上の会議体" }
    種別:       { kind: enum, enum: 決定種別, required: true, 記入主体: 導出, description: "今後変えられるか" }
    引用:       { kind: quote, required: true, 記入主体: 自動, description: "根拠となる発言の逐語" }
    信頼度:     { kind: enum, enum: 信頼度, required: true, 記入主体: 自動, description: "引用の裏付けの強さ" }
    derived_from: { kind: ref-list, ref: LOG, required: true, 記入主体: 自動, description: "根拠の LOG" }
    スコープ:   { kind: enum, enum: スコープ, required: true, 記入主体: 自動, description: "当初の合意に入っていたか" }
    議題:       { kind: ref, ref: AGD, required: false, 記入主体: 導出, description: "属する議題" }
    確定日:     { kind: date, required: false, 記入主体: 人間, description: "顧客提出版を送り、異議なく確定した日" }
    なぜ:       { kind: text, required: false, 記入主体: 人間, description: "決定の理由。人間が言った言葉だけ" }
    受容した不利: { kind: text, required: false, 記入主体: 人間, description: "採った案の不利" }
    確認方法:   { kind: text, required: false, 記入主体: 人間, description: "この決定が守られているかの確かめ方" }
    作らない:   { kind: enum, enum: 作らない, free: true, required: false, 記入主体: 人間, description: "この決定で作らないと決めたもの" }
    superseded_by: { kind: ref, ref: DEC, required: false, 記入主体: 人間, description: "この決定を覆した決定" }
    代替案:     { kind: struct-list, struct: 代替案, required: false, 記入主体: 自動, description: "検討して採らなかった案と却下理由" }

  Q:
    id:         { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:       { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    title:      { kind: text, required: true, 記入主体: 自動, description: "決めるために足りないこと" }
    status:     { kind: enum, enum: Q状態, required: true, 記入主体: 自動, description: "未定事項の状態" }
    確認先:     { kind: text, required: true, 記入主体: 自動, description: "回答を待っている役割" }
    対立当事者: { kind: str-list, required: false, 記入主体: 自動, description: "意見が合っていない役割" }
    初出:       { kind: date, required: true, 記入主体: 自動, description: "最初に出た会議の日" }
    最終言及:   { kind: date, required: true, 記入主体: 自動, description: "最後に言及された会議の日" }
    引用:       { kind: quote, required: true, 記入主体: 自動, description: "根拠となる発言の逐語" }
    信頼度:     { kind: enum, enum: 信頼度, required: true, 記入主体: 自動, description: "引用の裏付けの強さ" }
    derived_from: { kind: ref-list, ref: LOG, required: true, 記入主体: 自動, description: "根拠の LOG" }
    resolved_by: { kind: ref, ref: DEC, required: false, 記入主体: 自動, description: "この問いを解決した決定" }
    議題:       { kind: ref, ref: AGD, required: false, 記入主体: 導出, description: "属する議題" }

  ACT:
    id:         { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:       { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    title:      { kind: text, required: true, 記入主体: 自動, description: "やること" }
    担当:       { kind: text, required: false, 記入主体: 人間, description: "担う会社（社名）" }
    期限:       { kind: date, required: false, 記入主体: 人間, description: "期日" }
    status:     { kind: enum, enum: ACT状態, required: true, 記入主体: 人間, description: "アクションの状態" }
    対策種別:   { kind: enum, enum: 対策種別, required: false, 記入主体: 自動, description: "前提（ASM）への働きかけの種類" }
    引用:       { kind: quote, required: true, 記入主体: 自動, description: "根拠となる発言の逐語" }
    信頼度:     { kind: enum, enum: 信頼度, required: true, 記入主体: 自動, description: "引用の裏付けの強さ" }
    derived_from: { kind: ref-list, ref: LOG, required: true, 記入主体: 自動, description: "根拠の LOG" }
    関連:       { kind: ref-list, ref: any, required: false, 記入主体: 自動, description: "関係するカード" }
    更新履歴:   { kind: struct-list, struct: 更新履歴, required: false, 記入主体: 人間, description: "日付ごとの状態の変化" }
    issue:      { kind: text, required: false, 記入主体: 導出, description: "起票した GitHub Issue" }
    議題:       { kind: ref, ref: AGD, required: false, 記入主体: 導出, description: "属する議題" }

  CON:
    id:         { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:       { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    内容:       { kind: text, required: true, 記入主体: 自動, description: "制約の内容" }
    種類:       { kind: enum, enum: 制約種類, required: true, 記入主体: 自動, description: "環境の事実か、相手方への期待か" }
    所在:       { kind: enum, enum: 所在, required: true, 記入主体: 導出, description: "制約を持つ側" }
    硬度:       { kind: enum, enum: 硬度, required: true, 記入主体: 導出, description: "どれだけ覆しにくいか" }
    失効条件:   { kind: text, required: false, 記入主体: 自動, description: "制約が消える条件" }
    影響する決定: { kind: ref-list, ref: DEC, required: false, 記入主体: 自動, description: "この制約が効く決定" }
    derived_from: { kind: ref-list, ref: LOG, required: true, 記入主体: 自動, description: "根拠の LOG" }
    引用:       { kind: quote, required: false, 記入主体: 自動, description: "根拠となる発言の逐語" }
    信頼度:     { kind: enum, enum: 信頼度, required: false, 記入主体: 自動, description: "引用の裏付けの強さ" }
    承認:       { kind: date, required: true, 記入主体: 人間, description: "昇格を承認した日" }
    status:     { kind: enum, enum: ストック状態, required: true, 記入主体: 人間, description: "制約の状態" }

  ASM:
    id:         { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:       { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    内容:       { kind: text, required: true, 記入主体: 自動, description: "前提の内容" }
    崩れたら見直す決定: { kind: ref-list, ref: DEC, required: false, 記入主体: 自動, description: "前提が崩れたときに見直す決定" }
    脆弱性:     { kind: enum, enum: 脆弱性, required: true, 記入主体: 自動, description: "覆されやすさ" }
    signpost:   { kind: text, required: false, 記入主体: 自動, description: "前提が崩れたと分かる事象または閾値" }
    次回確認日: { kind: date, required: false, 記入主体: 人間, description: "次に確かめる日" }
    引用:       { kind: quote, required: true, 記入主体: 自動, description: "根拠となる発言の逐語" }
    信頼度:     { kind: enum, enum: 信頼度, required: true, 記入主体: 自動, description: "引用の裏付けの強さ" }
    derived_from: { kind: ref-list, ref: LOG, required: true, 記入主体: 自動, description: "根拠の LOG" }
    最終確認:   { kind: date, required: true, 記入主体: 人間, description: "最後に確かめた日" }
    status:     { kind: enum, enum: ASM状態, required: true, 記入主体: 人間, description: "前提の状態" }

  TERM:
    id:       { kind: id, required: true, 記入主体: 自動, description: "カードの ID。ファイル名と一致させる" }
    type:     { kind: text, required: true, 記入主体: 自動, description: "型を表す固定値" }
    正式:     { kind: text, required: true, 記入主体: 自動, description: "正式な表記" }
    読み:     { kind: text, required: false, 記入主体: 人間, description: "読み方" }
    表記揺れ: { kind: str-list, required: false, 記入主体: 自動, description: "文字起こしに実際に出た誤表記" }
    定義:     { kind: text, required: false, 記入主体: 人間, description: "この案件での意味" }
    初出:     { kind: ref, ref: LOG, required: false, 記入主体: 自動, description: "最初に出た LOG" }
    意味が確定した決定: { kind: ref, ref: DEC, required: false, 記入主体: 自動, description: "意味を確定させた決定" }

# ------------------------------------------------------------
# 構造化フィールド（配列 of マッピング）
# ------------------------------------------------------------

structs:

  代替案:
    keys: [案, 却下理由, 引用, 信頼度]
    required: [案, 却下理由]
    enums:
      信頼度: 信頼度

  更新履歴:
    free-key: date
    required: []

# ------------------------------------------------------------
# 型付きリンク
#   **リンクは片方向にしか書かない。** 議題と同じく、指す側を1つに決めて逆は引く
#   （`wiki.constraints_of(dec)` / `wiki.assumptions_of(dec)`）。両方向に書くと食い違う。
#   CON → DEC（影響する決定）と ASM → DEC（崩れたら見直す決定）はストック側が持つ。
#   ストックは昇格の時点で「どの決定に効くか」を人が承認して書くので、そちらが正本。
#   inverse を宣言した場合だけ、lint が双方向の一致を見る（いまは無い）。
# ------------------------------------------------------------

relations:
  derived_from:       { domain: [DEC, Q, ACT, CON, ASM], range: [LOG] }
  崩れたら見直す決定: { domain: [ASM], range: [DEC] }
  影響する決定:       { domain: [CON], range: [DEC] }
  resolved_by:        { domain: [Q], range: [DEC] }
  superseded_by:      { domain: [DEC], range: [DEC] }
  関連:               { domain: [ACT], range: [DEC, Q, CON, ASM] }
  初出:               { domain: [TERM], range: [LOG] }
  意味が確定した決定: { domain: [TERM], range: [DEC] }
  meeting:            { domain: [LOG], range: [MTG] }
  議題:               { domain: [DEC, Q, ACT], range: [AGD] }

# ------------------------------------------------------------
# 導出される関係
#
#   カード ↔ 会議は **多対多**である。
#   DEC / Q / ACT は derived_from で LOG を指し、LOG は meeting で MTG を指す。
#   そして「同じ論点が複数回の会議にまたがっても1枚のカードが更新されていく」
#   （README）以上、1枚の DEC が複数の MTG の LOG を参照する状態は正常であり、
#   1つの MTG からは当然いくつもの DEC が生える。
#
#   この多対多は frontmatter に直接は現れない。辿って得る関係なので、
#   カード側に meeting フィールドを持たせない（持たせると、2回目の会議で
#   更新したときに1つしか書けず、嘘になる）。
#
#   Q の 初出 / 最終言及 は、この多対多を日付に射影したもの。
#   だから「初出 = 最古の会議日」「最終言及 = 最新の会議日」で照合できる。
# ------------------------------------------------------------

derived-relations:

  会議:
    domain: [DEC, Q, ACT, CON, ASM]
    range: [MTG]
    cardinality: many-to-many
    via: [derived_from, meeting]
    date-anchors:
      Q: { first: 初出, last: 最終言及 }
      DEC: { first: 決定日 }
      CON: { last: 承認 }
      ASM: { last: 最終確認 }

# ------------------------------------------------------------
# 状態の整合
#   参照が埋まっているのに状態が追随していない、を検出するための宣言。
# ------------------------------------------------------------

status-implications:
  - { type: Q,   when-filled: resolved_by,   status: 解決 }
  - { type: DEC, when-filled: superseded_by, status: 覆された }

# ------------------------------------------------------------
# 導出
#   硬度は入力させず 種類 × 所在 から機械的に決める。
#
#   所在の語彙4値との組み合わせ8通りのうち expectation × 契約 は表に無い。
#   推測で埋めず未定義のままにし、lint は「導出表に無い組み合わせ」として warning を出す。
#   語彙 溶液 もどの組み合わせからも出ない（硬度の語彙にはあるが導出されない）。
# ------------------------------------------------------------

derivations:

  硬度:
    from: [種類, 所在]
    table:
      property/契約: 岩盤
      property/顧客側: 沈殿
      property/自社側: 沈殿
      property/協力会社: 沈殿
      expectation/顧客側: 沈殿
      expectation/自社側: 懸濁
      expectation/協力会社: 懸濁

  種別:
    from: role-mapping
    key: 決定の所在
    source-field: 決定の種別

  所在:
    from: role-mapping
    key: 発言役割
    source-field: 所属

# ------------------------------------------------------------
# 顧客提出版で落とすもの（render_minutes.md の「出さないもの」表）
#   機械判定できるものはここに宣言し、CLI が落とす。
#   LLM の遵守に賭けない（漏れたら契約上の事故になる）。
# ------------------------------------------------------------

editions:

  internal:
    exclude: []
    # 議事録の節構成。`kime minutes-input` が骨格として出す。
    # スキルに散文で持たせると、版を足したときに必ず片方が古くなる。
    sections:
      - { title: 前回アクションの結果, note: "ID・内容・担当・期限・状況の表" }
      - { title: 議題, note: "議題ごとに `### AGD-NNN タイトル`。この会議で扱ったか／扱えず・状態（決着・継続）・この会議の決定と未決。議題の文言を言い換えない" }
      - { title: 決定事項, note: "決定ごとに `### DEC-NNN タイトル`。決定の所在（種別）・なぜ・作らない・代替案の表（案／却下理由／根拠）・逐語引用を1つ" }
      - { title: 未決事項, note: "ID・内容・確認先・初出の表。この会議で解決した問いは別に並べる。末尾に「スコープの確認」（`スコープ: 判定保留` の決定・確認先）" }
      - { title: 今回のアクション, note: "ID・内容・担当・期限の表" }
      - { title: 新たに記録した制約・前提, note: "CON は（所在・硬度／失効条件）、ASM は（崩れたら見直す決定）を併記" }
      - { title: 議論の経緯, note: "LOG カード本文を `<details>` で畳む" }
      - { title: 記録の状態, note: "`信頼度: 推測` の件数、`却下理由: 記録なし` の件数、未登録の役割ラベル" }

  customer:
    exclude:
      - { type: DEC, field: 信頼度, value: 推測, reason: 未確認のものを合意事項として提示できない }
      - { type: CON, field: 所在, value: 自社側, reason: 自社の都合を対外に開示しない }
    exclude-alternatives:
      - { field: 却下理由, value: 記録なし, reason: 記録の不備を対外文書に書けない }
      - { field: 信頼度, value: 言及のみ, reason: 同上 }
      - { field: 信頼度, value: 推測, reason: 同上 }
    # 内部管理情報と、発言録に当たるもの。render_minutes.md の「出さないもの」表。
    #   - 逐語引用と LOG は原則出さない
    #   - カード ID はすべて内部管理情報（本体の id だけでなく、参照フィールドも）
    #   - 硬度・所在・信頼度・種類・スコープは内部メタ
    drop-fields:
      - id
      - derived_from
      - 引用
      - 信頼度
      - 硬度
      - 所在
      - 種類
      - スコープ
      - 会議体
      - superseded_by
      - resolved_by
      - 崩れたら見直す決定
      - 影響する決定
      - 関連
      - 更新履歴
      - issue
      - 対立当事者
      - 対策種別
      - 議題
      - 予定会議
      - 承認
      - 最終確認
      - 次回確認日
      - signpost
      - 失効条件
    # 値が内部状態を表しているだけのもの。フィールドごと落とすのではなく、
    # この値のときだけ落とす。
    drop-field-values:
      - { field: 作らない, value: 未記入 }
      - { field: 作らない, value: 記録なし }
    drop-sections: [記録の状態, 議論の経緯]
    role-to-company: true
    deemed-confirmation: true
    sections:
      - { title: 前回アクションの結果, note: "内容・担当・期限・状況（ID は出さない）" }
      - { title: 議題, note: "議題ごとに `### タイトル`（ID なし）。決着したか、次回も続けるか。議題の文言を言い換えない" }
      - { title: 決定事項, note: "`### タイトル`（ID なし）。決定内容と合意した理由、「本件で検討し、採用しなかった方式」の表（案／採用しなかった理由）" }
      - { title: 確認事項, note: "内容・確認先・期限。スコープの確認（当初の合意に入っていたか）も並べる" }
      - { title: アクション, note: "内容・担当・期限" }

# ------------------------------------------------------------
# 次回アジェンダ
#   節構成の正本。`kime agenda-input` が骨格として出し、`views/agenda-next.md`
#   も同じ順で並べる。**冒頭は `なぜ` 未記入の決定**（書かないことに付けたコスト）。
#
#   載せる議題（AGD）は機械で決まる: status が closed-status でなく、かつ
#   `予定会議` に対象会議を含む / `予定会議` がすべて対象会議より前（持ち越し）/
#   `予定会議` が空（次回）。決着するまで次回へ自動で残る。
# ------------------------------------------------------------

agenda:
  # 議題を言い換えただけの Q を拾う（lint の `q-restates-agenda`）。
  # 題名から次の語と記号を除いてから、文字の2字組の重なり（Dice 係数・百分率）を見る。
  # 開いた議題そのものが「まだ決まっていない」を表しているので、同じものを Q に立てない。
  # Q に立てるのは「決めるために足りないもの」（誰の何を待っているか）だけ。
  restate-strip: [を決めたい, を決める, について, をどうするか, どうするか, するか, か]
  restate-similarity-percent: 80
  sections:
    - { key: why-missing, title: "`なぜ` が未記入の決定（冒頭で確認）", note: "書かないことに付けたコスト。埋まるまで制約・前提へ昇格できない" }
    - { key: scope-pending, title: スコープの確認（当初の合意に入っていたか）, note: "`スコープ: 判定保留` の決定の射影。顧客側に聞く。判定したら決定の `スコープ` に書く（Q は立てない）" }
    - { key: open-actions, title: 前回からの未完了アクション, note: "担当・期限・状態" }
    - { key: agenda-items, title: 議題, note: "議題ごとに `### タイトル`。提起者・持ち越しか・これまでの決定・未決の問い・未完了のアクション。議題の文言を言い換えない" }
    - { key: loose-questions, title: 議題に紐づかない未決の問い, note: "確認先ごと" }
    - { key: assumptions, title: 前提の棚卸し（四半期に1回・5分）, note: "signpost に照らして「崩れたか」だけを見る" }

# ------------------------------------------------------------
# 閾値
#   コードにも lint のメッセージにも数値を再掲しない。正本はここ。
# ------------------------------------------------------------

thresholds:
  q-stale-days: 28
  dec-unconfirmed-days: 14
  asm-review-overdue-days: 0
  term-min-occurrences: 3
  deemed-confirmation-business-days: 3
  # 1回の会議で人間が承認しきれる昇格候補の上限。取りこぼしても次回に拾える。
  promote-candidates-max: 10
  # Pass 1 の論点数。この範囲に収まらないときは segments.yaml に逸脱理由を書く。
  segment-count-min: 3
  segment-count-max: 20
  # 論点の見出しの長さ。問いが分かる体言止めで、これ以内。
  segment-title-max: 20

# signpost が「事象または閾値」になっているかを機械で見るのは原理的に無理なので、
# 否定リストで明らかに足りないものだけを拾う。運用しながら語を足す。
signpost-vague-words: [注意, 監視, 確認する, 見ておく, 意識する, 気をつける, 把握する]

# 引用を照合できなかった印になる `信頼度` の値。verify-quotes --fix がこの値に降格し、
# 議事録・ビュー・昇格候補はこの値のカードを「未確認」として扱う。
unverified-confidence: 推測

# 人間が理由を言わなかったことを表す値（`なぜ`・`却下理由` など）。空欄とは別に、
# 「確認したが記録が無い」を残す。集計ではこの値と空欄を「記録されていない」として数える。
no-record-value: 記録なし

# 「前向きに検討します」の類。DEC ではなく Q に落とすべき表現。
# decision-guide.md の境界例に対応する。
deferral-phrases: [前向きに検討, 持ち帰り, 持ち帰ります, 調整します, 一旦置い, 検討します]

# ------------------------------------------------------------
# スコープが `判定保留` の決定を、顧客に聞く問いとして射影する
#   **カードにはしない。** `スコープ: 判定保留` という DEC の状態そのものが「まだ聞いて
#   いない」を表しているので、同じことを Q カードに写すと二重管理になる（閉じ忘れの
#   lint、`resolved_by` の流用、題名の一致で元の決定を推定する照合、が全部要らなくなる）。
#   `kime scope-questions` が一覧を出し、アジェンダの「スコープの確認」節と議事録の
#   未決事項／確認事項に同じ写像で出る。2-0 で人が `スコープ` を書けば、その時点で消える。
#
#   条件・題名・確認先は決定的なので LLM に書かせない。
#   `種別: 技術判断` を外すのは、技術判断がスコープ交渉の対象になるのが工数の増える
#   ときだけで、その場合は発話の側に「見積に入っていない」が現れるから。
#   相手に聞くことのない問いを出すと、次回アジェンダがスコープ判定で埋まり、
#   アジェンダそのものが読まれなくなる。
# ------------------------------------------------------------

scope-question:
  when-スコープ: 判定保留
  when-種別: [交渉可能, 契約制約]
  title-template: "{headline}は当初スコープ内か"
  # 確認先は、その決定の `決定の所在` が顧客側ならその役割。
  # そうでなければ顧客側で決定権のある役割にフォールバックする。
  確認先-所属: 顧客側

# 前提（ASM）の候補を拾うためのトリガー語。
#   DEC の `なぜ` と `代替案[].却下理由` を走査する。
#   検出は機械、昇格の可否は人間（`kime promote-input` が印を付けるだけ）。
assumption-trigger-words: [今は, 当面, のうちは, 現状, いまのところ, 今回は, 初期は, とりあえず, 一旦, 今のフェーズ, 規模なので]
