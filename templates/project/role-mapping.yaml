# ============================================================
# 役割 → 所属・社名・決定権のマッピング
#
# 話者分離が出力する役割ラベルを key にする。
# ラベルの表記が変わったらここを直す（プロンプト側は触らない）。
#
# このファイルが Pass 3 の解釈ルールと ACT の担当社名を決める。
# ============================================================

meta:
  project: トータル
  自社: ESM
  顧客: 〇〇株式会社            # ← 実際の社名に置き換える
  協力会社: []                  # 入る場合は社名を列挙

# ------------------------------------------------------------
# 決定権の意味
#   あり : この役割の「じゃあ〜で」で DEC を確定してよい
#   なし : この役割の発言だけでは DEC を起票しない（Q に落とす）
#
# 決定の種別
#   交渉可能   : 再提案の余地がある（顧客の業務判断）
#   技術判断   : 前提が変われば覆せる（自社の技術判断）
#   契約制約   : 覆せない（契約・法務・コンプライアンス）
# ------------------------------------------------------------

roles:

  顧客PM:
    所属: 顧客側
    社名: 〇〇株式会社
    決定権: あり
    決定の種別: 交渉可能

  顧客担当者:
    所属: 顧客側
    社名: 〇〇株式会社
    決定権: なし

  顧客法務:
    所属: 顧客側
    社名: 〇〇株式会社
    決定権: あり
    決定の種別: 契約制約

  発注元:
    所属: 顧客側
    社名: 〇〇株式会社
    決定権: あり
    決定の種別: 交渉可能

  開発リーダ:
    所属: 自社側
    社名: ESM
    決定権: あり
    決定の種別: 技術判断

  開発メンバー:
    所属: 自社側
    社名: ESM
    決定権: なし

  # 協力会社が入る場合の例
  # 協力会社リーダ:
  #   所属: 協力会社
  #   社名: △△株式会社
  #   決定権: あり
  #   決定の種別: 技術判断

# ------------------------------------------------------------
# 不明な役割ラベルが出てきた場合
#   Pass 3 は決定権「なし」として扱い、警告を出す。
#   ②の確認でこのファイルに追記する。
# ------------------------------------------------------------

unknown_role_default:
  所属: 不明
  社名: 不明
  決定権: なし
